<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07061a"/>
      <stop offset="1" stop-color="#130a2e"/>
    </linearGradient>
    <filter id="glowC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2a1d5c" stroke-width="1" opacity=".45"/>
    </pattern>
    <style>
      .maze{fill:none;stroke:#00e5ff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .mazeP{fill:none;stroke:#ff2bd6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .dot{fill:#fff6a8}
      .name{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:700;letter-spacing:6px}
      .mono{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes eat{0%,8%{opacity:1}12%,100%{opacity:0}}
      @keyframes flicker{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}97%{opacity:.7}}
      .blink{animation:blink 1s steps(1) infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .flicker{animation:flicker 5s linear infinite}
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Maze frame -->
  <g filter="url(#glowC)">
    <rect x="18" y="18" width="1244" height="284" rx="18" class="maze"/>
    <rect x="30" y="30" width="1220" height="260" rx="12" class="maze" stroke-width="1.5" opacity=".6"/>
    <!-- left maze walls -->
    <path class="maze" d="M70 70 H190 V120 M70 170 H130 V250 M190 190 V250 H230"/>
    <path class="mazeP" d="M110 120 V140 M230 200 V250"/>
    <!-- right maze walls -->
    <path class="maze" d="M1210 70 H1090 V120 M1210 170 H1150 V250 M1090 190 V250 H1050"/>
    <path class="mazeP" d="M1170 120 V140 M1050 200 V250"/>
  </g>

  <!-- Dot trail the runner eats -->
  <g filter="url(#glowC)">
        <g>
      <circle class="dot" cx="360" cy="268" r="4"/>
      <circle class="dot" cx="400" cy="268" r="4"/>
      <circle class="dot" cx="440" cy="268" r="4"/>
      <circle class="dot" cx="480" cy="268" r="4"/>
      <circle class="dot" cx="520" cy="268" r="4"/>
      <circle class="dot" cx="560" cy="268" r="4"/>
      <circle class="dot" cx="600" cy="268" r="4"/>
      <circle class="dot" cx="640" cy="268" r="4"/>
      <circle class="dot" cx="680" cy="268" r="4"/>
      <circle class="dot" cx="720" cy="268" r="4"/>
      <circle class="dot" cx="760" cy="268" r="4"/>
      <circle class="dot" cx="800" cy="268" r="4"/>
      <circle class="dot" cx="840" cy="268" r="4"/>
      <circle class="dot" cx="880" cy="268" r="4"/>
      <circle class="dot" cx="920" cy="268" r="4"/>
    </g>
    <!-- power pellets -->
    <circle class="dot pulse" cx="110" cy="210" r="8"/>
    <circle class="dot pulse" cx="1170" cy="210" r="8"/>
    <circle class="dot" cx="160" cy="95" r="4"/>
    <circle class="dot" cx="220" cy="160" r="4"/>
    <circle class="dot" cx="1120" cy="95" r="4"/>
    <circle class="dot" cx="1060" cy="160" r="4"/>
  </g>

  <!-- Runner: a glowing cursor block sliding along the dot line -->
  <g filter="url(#glowBig)">
    <rect x="330" y="254" width="22" height="28" rx="3" fill="#ffe600">
      <animate attributeName="x" values="330;950;330" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- cover that "eats" dots behind the runner on its way right -->
  <rect x="340" y="258" height="20" fill="#0d0824" width="0">
    <animate attributeName="width" values="0;600;600;0" keyTimes="0;0.5;0.98;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Name -->
  <g class="flicker">
    <text x="640" y="145" text-anchor="middle" class="name" font-size="84" fill="#ff2bd6" filter="url(#glowBig)">MORGANE SP</text>
    <text x="640" y="145" text-anchor="middle" class="name" font-size="84" fill="#ffd6f6">MORGANE SP</text>
  </g>

  <!-- Subtitle -->
  <text x="640" y="205" text-anchor="middle" class="mono" font-size="30" fill="#00e5ff" filter="url(#glowC)" letter-spacing="4">FULL STACK ENGINEER<tspan class="blink" fill="#ffe600"> ▮</tspan></text>
</svg>
